<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-in</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="box">
      <h1 id="hlabel">sign-in</h1>

      <div class="name">
        <input type="text" id="Nme" placeholder=" " />
        <label for="Nme" id="text">Name</label>
        <label for="Nme" id="errorName" class="errorText">error</label>
      </div>
      <div class="Email">
        <input type="email" id="Email2"  placeholder=" "/>
        <label for="Email2" id="Email1">Email</label>
        <label for="Email2" id="errorEmail" class="errorText">error</label>
      </div>
      <div class="password">
        <input type="password" id="password1" placeholder=" " />
        <label for="password1" id="Password">Password</label>
        <label for="password1" id="errorPassword" class="errorText">error</label>
      </div>
      <div class="repeat">
        <input type="password" id="password2" placeholder=" "/>
        <label for="password2" id="repeat">Repeat password</label>
        <label for="password2" id="errorConfirm" class="errorText">error</label>
      </div>
      <div class="button">
        <button id="btn">Confirm</button>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
